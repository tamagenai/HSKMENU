<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HSK 1級〜5級 学習アプリ総合メニュー 🐼</title>
  <meta name="description" content="HSK Level 1〜5 の5つの問題集アプリを紹介し、ワンタップで各レベルへジャンプできるPWA対応ポータルメニューです。">

  <!-- PWA設定 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#e11d48">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- iOS ホーム画面アイコン対応 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HSKメニュー">
  <link id="apple-touch-icon-link" rel="apple-touch-icon" href="icons/icon-192x192.png">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 祝勝紙吹雪用キャンバス -->
  <canvas id="confetti-canvas"></canvas>

  <!-- ヒーローヘッダー -->
  <header class="hero-header">
    <div class="hero-inner">
      <div class="mascot-Showcase">
        <div id="mascot-avatar-wrap" class="mascot-avatar-wrap" title="タップすると中国語で応援してくれるよ！">
          <img id="mascot-avatar-img" class="mascot-avatar" src="icons/panda-cheer.png" alt="応援パンダ">
          <span class="mascot-tap-badge">🔊 タップで応援</span>
        </div>
        <div class="mascot-bubble">
          <span id="mascot-bubble-text">「加油！今日も好きな級のカードをタップして中国語を楽しもう🐼✨」</span>
        </div>
      </div>

      <span class="hero-badge">🐼 PWA対応・ホーム画面に追加OK</span>
      <h1 class="hero-title">HSK 1級〜5級 学習アプリ総合メニュー</h1>
      <p class="hero-subtitle">
        入門の1級（150語）から上級の5級（2,500語）まで、5つのHSK問題集アプリへワンタップでジャンプ！
      </p>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="container">
    <!-- 可愛いアイコン着せ替え＆満点ファンファーレ試聴バー -->
    <section class="customize-card" aria-label="アイコン着せ替えとファンファーレ試聴">
      <div class="icon-selector-group">
        <span class="selector-label">🎨 可愛いアイコン着せ替え：</span>
        <div class="icon-options">
          <button type="button" class="icon-opt-btn active" data-icon="cheer">
            <img src="icons/panda-cheer.png" alt="応援パンダ">
            <span>① 応援パンダ</span>
          </button>
          <button type="button" class="icon-opt-btn" data-icon="scholar">
            <img src="icons/panda-scholar.png" alt="パンダ博士">
            <span>② パンダ博士</span>
          </button>
          <button type="button" class="icon-opt-btn" data-icon="crown">
            <img src="icons/panda-crown.png" alt="王冠パンダ">
            <span>③ 王冠パンダ</span>
          </button>
        </div>
      </div>

      <button type="button" id="fanfare-try-btn" class="fanfare-try-btn">
        <span>🎺 100点満点ファンファーレを試聴！</span>
      </button>
    </section>

    <!-- アプリ一覧見出し -->
    <div class="section-heading">
      <h2>📚 レベル別 HSK対策アプリ一覧</h2>
      <span class="section-sub">カードまたはボタンをクリックしてジャンプ</span>
    </div>

    <!-- アプリ紹介カードコンテナ -->
    <div id="app-list-container" class="app-cards-list">
      <!-- script.js により動的にレンダリングされます -->
    </div>
  </main>

  <footer class="portal-footer">
    <p>&copy; 2026 HSK Level 1-5 Learning Portal &mdash; 加油！毎日の積み重ねが合格への近道🐼</p>
  </footer>

  <!-- PWAインストールボタン -->
  <button id="install-button" class="install-fab">
    <span>📲 アプリをホーム画面に追加</span>
  </button>

  <!-- PWA更新通知バナー -->
  <div id="update-notification" class="update-notification">
    <span>新しいバージョンが利用可能です！</span>
    <button id="reload-button">更新する</button>
  </div>

  <script src="script.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      let newWorker;

      function showUpdateBar() {
        const notification = document.getElementById('update-notification');
        if (notification) notification.style.display = 'block';
      }

      document.getElementById('reload-button').addEventListener('click', () => {
        if (newWorker) {
          newWorker.postMessage({ action: 'skipWaiting' });
        }
      });

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js').then((reg) => {
          reg.addEventListener('updatefound', () => {
            newWorker = reg.installing;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                showUpdateBar();
              }
            });
          });
        }).catch((err) => {
          console.error('Service Worker registration failed:', err);
        });

        let refreshing;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (refreshing) return;
          window.location.reload();
          refreshing = true;
        });
      });
    }
  </script>
</body>
</html>
