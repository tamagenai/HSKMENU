<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)"/>
  <!-- Golden stars -->
  <circle cx="24" cy="26" r="4" fill="#fde047"/>
  <circle cx="104" cy="26" r="4" fill="#fde047"/>
  <!-- Panda Ears -->
  <circle cx="36" cy="36" r="14" fill="#1e293b"/>
  <circle cx="92" cy="36" r="14" fill="#1e293b"/>
  <!-- Panda Head -->
  <circle cx="64" cy="62" r="36" fill="#ffffff"/>
  <!-- Eye patches -->
  <ellipse cx="49" cy="58" rx="10" ry="12" transform="rotate(-12 49 58)" fill="#1e293b"/>
  <ellipse cx="79" cy="58" rx="10" ry="12" transform="rotate(12 79 58)" fill="#1e293b"/>
  <!-- Eyes -->
  <circle cx="50" cy="56" r="4.5" fill="#ffffff"/>
  <circle cx="78" cy="56" r="4.5" fill="#ffffff"/>
  <circle cx="51.5" cy="54.5" r="2" fill="#1e293b"/>
  <circle cx="79.5" cy="54.5" r="2" fill="#1e293b"/>
  <!-- Rosy Cheeks -->
  <ellipse cx="38" cy="70" rx="6" ry="3.5" fill="#fda4af"/>
  <ellipse cx="90" cy="70" rx="6" ry="3.5" fill="#fda4af"/>
  <!-- Nose & Smile -->
  <ellipse cx="64" cy="67" rx="5" ry="3.5" fill="#1e293b"/>
  <path d="M56 73 Q64 81 72 73" fill="none" stroke="#1e293b" stroke-width="3" stroke-linecap="round"/>
  <!-- HSK Badge at bottom -->
  <rect x="22" y="96" width="84" height="24" rx="12" fill="#fef08a" stroke="#ca8a04" stroke-width="2"/>
  <text x="64" y="113" text-anchor="middle" font-size="15" font-family="sans-serif" font-weight="900" fill="#be123c">HSK 1-5</text>
</svg>
